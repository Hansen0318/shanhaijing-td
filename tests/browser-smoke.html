    <button data-state="zhulong2">燭龍 P2</button>

    <button data-state="level9victory">第9關 Victory</button>

    <button data-width="375">375px</button>
    <button data-width="390">390px</button>

    <p id="status">等待遊戲載入</p>
  </div>
  <iframe id="game-frame" title="Shanhaijing TD smoke target" src="../index.html?v=asset-load-3"></iframe>
  <script type="module">
    const frame = document.querySelector('#game-frame');
    const status = document.querySelector('#status');

    const ready = () => new Promise(resolve => {
      if (frame.contentWindow?.__SHANHAIJING_TD__) return resolve();
      frame.addEventListener('load', resolve, { once: true });
    });

    function snapshot(label) {
      const game = frame.contentWindow.__SHANHAIJING_TD__;
      const rect = frame.contentDocument.querySelector('#game-canvas').getBoundingClientRect();
      const bosses = game.enemies.filter(enemy => enemy.isBoss);
      const queuedBosses = game.wave.queue.filter(type => type === game.level.bossType).length;
      status.textContent = `${label}｜level ${game.levelId} ${game.level.name}｜state ${game.state}｜wave ${game.wave.waveNumber}｜canvas ${rect.width.toFixed(2)}×${rect.height.toFixed(2)}｜boss ${bosses[0] ? Math.ceil(bosses[0].hp) : 'none'}｜boss count ${bosses.length}｜queued boss ${queuedBosses}｜banner ${game.banner || 'none'}`;
    }

    function configureMixedWave(game) {
      game.restart();
      game.economy.add(2000);
      game.buildTower(0, 'bifang');
      game.buildTower(1, 'fuzhu');
      game.buildTower(6, 'yinglong');
      game.wave.waveNumber = 7;
    }

    const twoFrames = () => new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));

    async function enterLevel2(game) {
      if (game.levelId === 2) { game.restart(); return; }
      game.end('victory');
      await twoFrames();
      frame.contentDocument.querySelector('#next-level-button').click();
      while (game.levelId !== 2 || frame.contentDocument.body.classList.contains('art-loading')) {
        await new Promise(resolve => setTimeout(resolve, 25));
      }
      await twoFrames();
    }

    async function configureLevel2MixedWave(game) {
      await enterLevel2(game);
      game.economy.add(2000);
      game.buildTower(0, 'bifang');
      game.buildTower(3, 'fuzhu');
      game.buildTower(6, 'yinglong');
      game.wave.waveNumber = 7;
    }

    async function configureLevel2Boss(game) {
      await enterLevel2(game);
      game.wave.waveNumber = 9;
      game.startWaveNow();
      const queuedBoss = game.wave.queue.indexOf('paoxiao');
      if (queuedBoss >= 0) game.wave.queue.splice(queuedBoss, 1);
      game.spawnEnemy('paoxiao');
    }

    async function enterLevel3(game) {
      await enterLevel2(game);
      game.end('victory');
      await twoFrames();
      frame.contentDocument.querySelector('#next-level-button').click();
      while (game.levelId !== 3 || frame.contentDocument.body.classList.contains('art-loading')) {
        await new Promise(resolve => setTimeout(resolve, 25));
      }
      await twoFrames();
    }

    async function configureLevel3Boss(game) {
      await enterLevel3(game);
      game.wave.waveNumber = 9;
      game.startWaveNow();
      const queuedBoss = game.wave.queue.indexOf('xiangliu');
      if (queuedBoss >= 0) game.wave.queue.splice(queuedBoss, 1);
      game.spawnEnemy('xiangliu');
    }

    async function enterLevel4(game, confirm = false) {
      if (game.levelId === 4) {
        game.restart();
        if (confirm) {
          for (const type of ['bifang', 'fuzhu', 'baize']) game.toggleLineup(type);
          game.confirmLineup();
        }
        await twoFrames();
        return;
      }
      await enterLevel3(game);
      game.end('victory');
      await twoFrames();
      frame.contentDocument.querySelector('#next-level-button').click();
      while (game.levelId !== 4 || frame.contentDocument.body.classList.contains('art-loading')) {
        await new Promise(resolve => setTimeout(resolve, 25));
      }
      if (confirm && game.state === 'lineup') {
        for (const type of ['bifang', 'fuzhu', 'baize']) game.toggleLineup(type);
        game.confirmLineup();
      }
      await twoFrames();
    }

    async function configureLevel4Boss(game) {
      await enterLevel4(game, true);
      game.wave.waveNumber = 9;
      game.startWaveNow();
      game.wave.queue.length = 0;
      game.wave.spawnedAlive = 1;
      game.spawnEnemy('jiuweihu');
    }

    async function enterLevel5(game, confirm = false) {
      if (game.levelId === 5) {
        game.restart();
      } else {
        await enterLevel4(game, true);
        game.end('victory');
        await twoFrames();
        frame.contentDocument.querySelector('#next-level-button').click();
        while (game.levelId !== 5 || frame.contentDocument.body.classList.contains('art-loading')) await new Promise(resolve => setTimeout(resolve, 25));
      }
      if (confirm && game.state === 'lineup') {
        for (const type of ['bifang', 'fuzhu', 'baize']) game.toggleLineup(type);
        game.confirmLineup();
      }
      await twoFrames();
    }

    async function enterLevel6(game, confirm = false) {
      if (game.levelId === 6) {
        game.restart();
      } else {
        await enterLevel5(game, true);
        game.end('victory');
        await twoFrames();
        frame.contentDocument.querySelector('#next-level-button').click();
        while (game.levelId !== 6 || frame.contentDocument.body.classList.contains('art-loading')) await new Promise(resolve => setTimeout(resolve, 25));
      }
      if (confirm && game.state === 'lineup') {
        for (const type of ['bifang', 'fuzhu', 'baize']) game.toggleLineup(type);
        game.confirmLineup();
      }
      await twoFrames();
    }

    async function configureLevel6Boss(game) {
      await enterLevel6(game, true);
      game.wave.waveNumber = 9;
      game.startWaveNow();
      game.wave.queue.length = 0;
      game.wave.spawnedAlive = 1;
      game.spawnEnemy('jinwu');
    }

    async function enterLevel7(game, confirm = false) {
      if (game.levelId === 7) {
        game.restart();
      } else {
        await enterLevel6(game, true);
        game.end('victory');
        await twoFrames();
        frame.contentDocument.querySelector('#next-level-button').click();
        while (game.levelId !== 7 || frame.contentDocument.body.classList.contains('art-loading')) await new Promise(resolve => setTimeout(resolve, 25));
      }
      if (confirm && game.state === 'lineup') {
        for (const type of ['bifang', 'baize', 'jumang']) game.toggleLineup(type);
        game.confirmLineup();
      }
      await twoFrames();
    }

    async function configureLevel7Boss(game) {
      await enterLevel7(game, true);
      game.wave.waveNumber = 9;
      game.startWaveNow();
      game.wave.queue.length = 0;
      game.wave.spawnedAlive = 1;
      game.spawnEnemy('kui');
    }

    async function enterLevel8(game, confirm = false, includeXuangui = false) {
      if (game.levelId === 8) {
        game.restart();
      } else {
        await enterLevel7(game, true);
        game.end('victory');
        await twoFrames();
        frame.contentDocument.querySelector('#next-level-button').click();
        while (game.levelId !== 8 || frame.contentDocument.body.classList.contains('art-loading')) await new Promise(resolve => setTimeout(resolve, 25));
      }
      if (includeXuangui) game.unlockedBeasts.add('xuangui');
      if (confirm && game.state === 'lineup') {
        const lineup = includeXuangui ? ['xuangui', 'bifang', 'jumang'] : ['bifang', 'baize', 'jumang'];
        for (const type of lineup) game.toggleLineup(type);
        game.confirmLineup();
      }
      await twoFrames();
    }

    async function configureLevel8Boss(game) {
      await enterLevel8(game, true);
      game.wave.waveNumber = 9;
      game.startWaveNow();
      game.wave.queue.length = 0;
      game.wave.spawnedAlive = 1;
      game.spawnEnemy('huashe');
    }

    function placeInWetland(game, enemy, zoneId = 'A') {
      for (let distance = 0; distance <= game.map.totalLength; distance += 1) {
        const point = game.map.positionAt(distance);
        if (game.map.wetlandZoneAt(point) !== zoneId) continue;
        enemy.pathDistance = distance;
        Object.assign(enemy, point);
        return;
      }
    }

    function placeInThunder(game, enemy, zoneId) {
      const zone = game.level.map.thunderZones.find(item => item.id === zoneId);
      enemy.x = zone.x + zone.width / 2;
      enemy.y = zone.y + zone.height / 2;
    }

    function placeInSunlight(game, enemy, zoneId) {
      for (let distance = 0; distance <= game.map.totalLength; distance += 1) {
        const point = game.map.positionAt(distance);
        if (game.map.sunlightZoneAt(point) !== zoneId) continue;
        enemy.pathDistance = distance;
        Object.assign(enemy, point);
        return;
      }
    }

    document.addEventListener('click', async event => {
      const heightButton = event.target.closest('[data-height]');
      if (heightButton) {
        await ready();
        frame.style.height = `${heightButton.dataset.height}px`;
        requestAnimationFrame(() => requestAnimationFrame(() => snapshot(`高度 ${heightButton.dataset.height}px`)));
        return;
      }
      const widthButton = event.target.closest('[data-width]');
      if (widthButton) {
        await ready();
        frame.style.width = `${widthButton.dataset.width}px`;
        requestAnimationFrame(() => requestAnimationFrame(() => snapshot(`${widthButton.dataset.width}px`)));
        return;
      }
      const button = event.target.closest('[data-state]');
      if (!button) return;
      await ready();
      const game = frame.contentWindow.__SHANHAIJING_TD__;
      const state = button.dataset.state;
      if (state === 'level8To9') {
        frame.src = '../index.html?devLevel=8&devVictory=1';
        await new Promise(resolve => frame.addEventListener('load', resolve, { once: true }));
        await twoFrames();
        frame.contentDocument.querySelector('#next-level-button').click();
        while (frame.contentWindow.__SHANHAIJING_TD__?.levelId !== 9
          || frame.contentDocument.body.classList.contains('art-loading')) {
          await new Promise(resolve => setTimeout(resolve, 25));
        }
        await twoFrames();
        snapshot(button.textContent);
        return;
      }
      const levelNineFixtures = {
        level9: 'devLevel=9', level9wave1: 'devLevel=9&devWave=1',
        level9day: 'devLevel=9&devState=day', level9night: 'devLevel=9&devState=night',
        level9telegraph: 'devLevel=9&devState=telegraph',
        tiangouDay: 'devLevel=9&devState=day&devEnemy=tiangou',
        zhengNight: 'devLevel=9&devState=night&devEnemy=zheng',
        zhulong1: 'devLevel=9&devBossPhase=1', zhulong2: 'devLevel=9&devBossPhase=2',
        level9Xuangui: 'devLevel=9&devXuangui=1', level9victory: 'devLevel=9&devVictory=1',
        level9retry: 'devLevel=9&devRetry=1',
      };
      if (levelNineFixtures[state]) {
        frame.src = `../index.html?${levelNineFixtures[state]}`;
        await new Promise(resolve => frame.addEventListener('load', resolve, { once: true }));
        await twoFrames();
        snapshot(button.textContent);
        return;
      }
      if (state === 'reset') game.restart();
      if (state === 'empty') { game.restart(); game.selectedSlot = 0; }
      if (state === 'tower') { game.restart(); game.buildTower(0, 'bifang'); game.selectedSlot = 0; }
      if (state === 'towerFacingLeft' || state === 'towerFacingRight') {
        configureMixedWave(game);
        const offset = state === 'towerFacingLeft' ? -40 : 40;
        game.towers.filter(Boolean).forEach(tower => tower.faceTarget(tower.x + offset));
      }
      if (state === 'upgrade') { game.restart(); game.economy.add(500); game.buildTower(0, 'bifang'); game.upgradeTower(0); game.sellTower(0); game.selectedSlot = 0; }
      if (state === 'wave1') { game.restart(); game.buildTower(0, 'bifang'); game.buildTower(4, 'fuzhu'); game.startWaveNow(); }
      if (state === 'wave8preview') configureMixedWave(game);
      if (state === 'wave8') {
        configureMixedWave(game);
        game.startWaveNow();
        [['minion', 100], ['swift', 200], ['giant', 280], ['minion', 300]].forEach(([type, distance]) => {
          game.spawnEnemy(type);
          game.enemies.at(-1).pathDistance = distance;
        });
      }
      if (state === 'wave10') {
        game.restart();
        game.wave.waveNumber = 9;
        game.startWaveNow();
        const queuedBoss = game.wave.queue.indexOf('qiongqi');
        if (queuedBoss >= 0) game.wave.queue.splice(queuedBoss, 1);
        game.spawnEnemy('qiongqi');
      }
      if (state === 'frenzy') {
        const boss = game.enemies.find(enemy => enemy.isBoss);
        if (boss) { boss.hp = boss.maxHp * 0.5; game.update(0); }
      }
      if (state === 'qiongqi25') {
        let boss = game.enemies.find(enemy => enemy.type === 'qiongqi');
        if (!boss) {
          game.restart(); game.wave.waveNumber = 9; game.startWaveNow();
          const queuedBoss = game.wave.queue.indexOf('qiongqi');
          if (queuedBoss >= 0) game.wave.queue.splice(queuedBoss, 1);
          game.spawnEnemy('qiongqi'); boss = game.enemies.at(-1);
        }
        boss.hp = boss.maxHp * 0.25;
        game.update(0);
      }
      if (state === 'nextbanner') game.advanceBanner(game.bannerTimer + 0.01);
      if (state === 'victory') {
        const boss = game.enemies.find(enemy => enemy.isBoss);
        if (boss) { boss.takeDamage(boss.maxHp); game.update(0); }
      }
      if (state === 'blessing') {
        game.restart();
        game.currentChoices = game.blessings.drawChoices([]);
        game.state = 'blessing';
      }
      if (state === 'defeat') { game.restart(); game.damageBase(game.baseHp); }
      if (state === 'level2') await enterLevel2(game);
      if (state === 'level2wave8') {
        await configureLevel2MixedWave(game);
        game.startWaveNow();
        [['chiyu', 120], ['swift', 210], ['yanjia', 290]].forEach(([type, distance]) => {
          game.spawnEnemy(type);
          game.enemies.at(-1).pathDistance = distance;
        });
      }
      if (state === 'level2wave10') await configureLevel2Boss(game);
      if (['paoxiao50', 'paoxiao25'].includes(state)) {
        let boss = game.enemies.find(enemy => enemy.type === 'paoxiao');
        if (!boss) { await configureLevel2Boss(game); boss = game.enemies.find(enemy => enemy.type === 'paoxiao'); }
        boss.triggeredBossThresholds.add(0.7);
        boss.triggeredBossThresholds.add(0.4);
        boss.hp = boss.maxHp * (Number(state.replace('paoxiao', '')) / 100);
        game.update(0);
      }
      if (state === 'consume70') {
        let boss = game.enemies.find(enemy => enemy.type === 'paoxiao');
        if (!boss) { await configureLevel2Boss(game); boss = game.enemies.find(enemy => enemy.type === 'paoxiao'); }
        boss.hp = boss.maxHp * 0.7;
        game.update(0);
      }
      if (state === 'consume40') {
        let boss = game.enemies.find(enemy => enemy.type === 'paoxiao');
        if (!boss) { await configureLevel2Boss(game); boss = game.enemies.find(enemy => enemy.type === 'paoxiao'); }
        boss.hp = boss.maxHp * 0.4;
        game.update(0);
      }
      if (state === 'level2victory') {
        let boss = game.enemies.find(enemy => enemy.type === 'paoxiao');
        if (!boss) { await configureLevel2Boss(game); boss = game.enemies.find(enemy => enemy.type === 'paoxiao'); }
        boss.takeDamage(boss.maxHp);
        game.update(0);
      }
      if (state === 'level3') await enterLevel3(game);
      if (state === 'level3wave8') {
        await enterLevel3(game);
        game.economy.add(2000);
        game.buildTower(0, 'bifang');
        game.buildTower(3, 'fuzhu');
        game.buildTower(6, 'yinglong');
        game.wave.waveNumber = 7;
        game.startWaveNow();
        [['shuixiao', 120], ['xuanjiashou', 270], ['shuixiao', 440]].forEach(([type, distance]) => {
          game.spawnEnemy(type);
          const enemy = game.enemies.at(-1);
          enemy.pathDistance = distance;
          Object.assign(enemy, game.map.positionAt(distance));
        });
      }
      if (state === 'level3wave10') await configureLevel3Boss(game);
      if (['xiangliu75', 'xiangliu50', 'xiangliu25'].includes(state)) {
        let boss = game.enemies.find(enemy => enemy.type === 'xiangliu');
        if (!boss) { await configureLevel3Boss(game); boss = game.enemies.find(enemy => enemy.type === 'xiangliu'); }
        const ratio = Number(state.replace('xiangliu', '')) / 100;
        boss.hp = boss.maxHp * ratio;
        if (ratio <= 0.5) boss.triggeredBossThresholds.add(0.75);
        if (ratio <= 0.5) boss.triggeredBossThresholds.add(0.5);
        game.update(0);
      }
      if (state === 'level3victory') {
        let boss = game.enemies.find(enemy => enemy.type === 'xiangliu');
        if (!boss) { await configureLevel3Boss(game); boss = game.enemies.find(enemy => enemy.type === 'xiangliu'); }
        boss.takeDamage(boss.maxHp);
        game.update(0);
      }
      if (state === 'level4') await enterLevel4(game, false);
      if (state === 'level4wave1') {
        await enterLevel4(game, true);
        game.buildTower(0, 'baize');
        game.buildTower(3, 'bifang');
        game.startWaveNow();
      }
      if (['fogUpper', 'fogLowerInsight'].includes(state)) {
        await enterLevel4(game, true);
        game.state = 'combat';
        game.time.setPaused(false);
        const enemy = game.spawnEnemy('meihu');
        enemy.pathDistance = state === 'fogUpper' ? 345 : 936;
        Object.assign(enemy, game.map.positionAt(enemy.pathDistance));
        if (state === 'fogLowerInsight') enemy.statuses.insight = { remaining: 3 };
        game.update(0);
      }
      if (state === 'level4boss') await configureLevel4Boss(game);
      if (state === 'jiuweihu50') {
        let boss = game.enemies.find(enemy => enemy.type === 'jiuweihu');
        if (!boss) { await configureLevel4Boss(game); boss = game.enemies.find(enemy => enemy.type === 'jiuweihu'); }
        boss.hp = boss.maxHp * 0.5;
        game.update(0);
      }
      if (['jiuweihu2', 'jiuweihu3'].includes(state)) {
        let boss = game.enemies.find(enemy => enemy.type === 'jiuweihu');
        if (!boss) { await configureLevel4Boss(game); boss = game.enemies.find(enemy => enemy.type === 'jiuweihu'); }
        boss.hp = boss.maxHp * 0.6;
        game.update(0);
        if (state === 'jiuweihu3') { boss.hp = boss.maxHp * 0.25; game.update(0); }
      }
      if (state === 'level4victory') {
        let boss = game.enemies.find(enemy => enemy.type === 'jiuweihu');
        if (!boss) { await configureLevel4Boss(game); boss = game.enemies.find(enemy => enemy.type === 'jiuweihu'); }
        boss.takeDamage(boss.maxHp);
        game.update(0);
      }
      if (state === 'level5') await enterLevel5(game, false);
      if (state === 'level6') await enterLevel6(game, false);
      if (state === 'level6wave1') {
        await enterLevel6(game, true);
        game.startWaveNow();
      }
      if (['sunlightA', 'sunlightB'].includes(state)) {
        await enterLevel6(game, true);
        game.state = 'combat';
        game.time.setPaused(false);
        game.sunlight.elapsed = state === 'sunlightA' ? 0 : 6;
        const enemy = game.spawnEnemy(state === 'sunlightA' ? 'yangyu' : 'fusangjiashou');
        placeInSunlight(game, enemy, state === 'sunlightA' ? 'A' : 'B');
        game.update(0);
      }
      if (['jinwu1', 'jinwu2', 'jinwu25'].includes(state)) {
        let boss = game.enemies.find(enemy => enemy.type === 'jinwu');
        if (!boss) { await configureLevel6Boss(game); boss = game.enemies.find(enemy => enemy.type === 'jinwu'); }
        if (state !== 'jinwu1') { boss.hp = boss.maxHp * (state === 'jinwu2' ? 0.5 : 0.25); game.update(0); }
      }
      if (state === 'level6victory') {
        await enterLevel6(game, true);
        game.end('victory');
      }
      if (state === 'level6retry') {
        await enterLevel6(game, true);
        game.restart();
      }
      if (state === 'level7') await enterLevel7(game, false);
      if (state === 'level7wave1') {
        await enterLevel7(game, true);
        game.economy.add(500);
        game.buildTower(0, 'jumang');
        game.startWaveNow();
      }
      if (['thunderA', 'thunderB'].includes(state)) {
        await enterLevel7(game, true);
        game.state = 'combat';
        game.time.setPaused(false);
        const zoneId = state === 'thunderA' ? 'A' : 'B';
        const enemy = game.spawnEnemy(zoneId === 'A' ? 'qinyuan' : 'zhuhuai');
        placeInThunder(game, enemy, zoneId);
        game.thunder.sequenceIndex = zoneId === 'B' ? 1 : 0;
        game.thunder.countdown = 0.9;
        game.update(0);
        if (state === 'thunderB') game.update(0.9);
      }
      if (['kui1', 'kui2', 'kui25'].includes(state)) {
        let boss = game.enemies.find(enemy => enemy.type === 'kui');
        if (!boss) { await configureLevel7Boss(game); boss = game.enemies.find(enemy => enemy.type === 'kui'); }
        if (state !== 'kui1') {
          boss.hp = boss.maxHp * (state === 'kui2' ? 0.5 : 0.25);
          game.update(0);
        }
      }
      if (state === 'level7victory') {
        await enterLevel7(game, true);
        game.end('victory');
      }
      if (state === 'level7retry') {
        await enterLevel7(game, true);
        game.restart();
      }
      if (state === 'level8') await enterLevel8(game, false);
      if (state === 'level8wave1') {
        await enterLevel8(game, true);
        game.startWaveNow();
      }
      if (['tideTelegraph', 'tideHigh'].includes(state)) {
        await enterLevel8(game, true);
        game.state = 'combat';
        game.time.setPaused(false);
        const enemy = game.spawnEnemy(state === 'tideHigh' ? 'gudiao' : 'changyou');
        placeInWetland(game, enemy);
        if (state === 'tideTelegraph') game.tide.elapsed = 6.8;
        else game.tide.forcedRemaining = 2.4;
        game.update(0);
      }
      if (['huashe1', 'huashe2'].includes(state)) {
        let boss = game.enemies.find(enemy => enemy.type === 'huashe');
        if (!boss) { await configureLevel8Boss(game); boss = game.enemies.find(enemy => enemy.type === 'huashe'); }
        if (state === 'huashe2') { boss.hp = boss.maxHp * 0.5; game.update(0); }
      }
      if (state === 'xuanguiShock') {
        await enterLevel8(game, true, true);
        game.economy.add(1000);
        game.buildTower(0, 'xuangui');
        const tower = game.towers[0];
        tower.successfulAttacks = 3;
        game.state = 'combat';
        game.time.setPaused(false);
        const enemy = game.spawnEnemy('gudiao');
        Object.assign(enemy, { x: tower.x + 28, y: tower.y });
        game.updateTowers(0);
        game.projectiles.at(-1)?.impact(game.enemies);
        game.updatePendingShocks(0.35);
      }
      if (state === 'level8victory') {
        await enterLevel8(game, true);
        game.end('victory');
      }
      if (state === 'level8retry') {
        await enterLevel8(game, true);
        game.restart();
      }
      requestAnimationFrame(() => requestAnimationFrame(() => snapshot(button.textContent)));
    });

    await ready();
    snapshot('初始');
  </script>
</body>
</html>
