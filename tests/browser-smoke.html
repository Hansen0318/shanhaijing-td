<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shanhaijing TD V0.02 Browser Smoke</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 10px; background: #e8ece9; color: #18241d; font-family: system-ui, sans-serif; }
    .toolbar { position: sticky; z-index: 2; top: 0; display: flex; flex-wrap: wrap; gap: 6px; padding: 8px; background: rgba(232,236,233,.96); }
    button { min-height: 44px; padding: 7px 10px; border: 1px solid #55705d; border-radius: 8px; background: #274d37; color: white; font-weight: 700; }
    #status { width: 100%; margin: 0; font-size: 12px; }
    iframe { display: block; width: 100%; height: 760px; border: 2px solid #55705d; background: #101a16; }
  </style>
</head>
<body>
  <div class="toolbar">
    <button data-state="reset">重設</button>
    <button data-state="empty">空塔位</button>
    <button data-state="tower">塔資訊</button>
    <button data-state="upgrade">升級／出售</button>
    <button data-state="wave1">Wave 1</button>
    <button data-state="wave8preview">Wave 8 預告</button>
    <button data-state="wave8">Wave 8</button>
    <button data-state="wave10">Wave 10</button>
    <button data-state="frenzy">Boss 50%</button>
    <button data-state="nextbanner">下一段提示</button>
    <button data-state="victory">擊敗 Boss</button>
    <button data-state="blessing">Blessing</button>
    <button data-state="defeat">Defeat</button>
    <button data-state="level2">第2關</button>
    <button data-state="level2wave8">第2關 Wave 8</button>
    <button data-state="level2wave10">第2關 Wave 10</button>
    <button data-state="consume70">吞噬 70%</button>
    <button data-state="consume40">吞噬 40%</button>
    <button data-state="level2victory">第2關 Victory</button>
    <button data-width="320">320px</button>
    <button data-width="375">375px</button>
    <button data-width="390">390px</button>
    <button data-width="430">430px</button>
    <button data-height="700">高度 700px</button>
    <p id="status">等待遊戲載入</p>
  </div>
  <iframe id="game-frame" title="Shanhaijing TD smoke target" src="../index.html?v=motion-lite-1"></iframe>
  <script type="module">
    const frame = document.querySelector('#game-frame');
    const status = document.querySelector('#status');

    const ready = () => new Promise(resolve => {
      if (frame.contentWindow?.__SHANHAIJING_TD__) return resolve();
      frame.addEventListener('load', resolve, { once: true });
    });

    function snapshot(label) {
      const game = frame.contentWindow.__SHANHAIJING_TD__;
      const rect = frame.contentDocument.querySelector('#game-canvas').getBoundingClientRect();
      const bosses = game.enemies.filter(enemy => enemy.isBoss);
      const queuedBosses = game.wave.queue.filter(type => type === game.level.bossType).length;
      status.textContent = `${label}｜level ${game.levelId} ${game.level.name}｜state ${game.state}｜wave ${game.wave.waveNumber}｜canvas ${rect.width.toFixed(2)}×${rect.height.toFixed(2)}｜boss ${bosses[0] ? Math.ceil(bosses[0].hp) : 'none'}｜boss count ${bosses.length}｜queued boss ${queuedBosses}｜banner ${game.banner || 'none'}`;
    }

    function configureMixedWave(game) {
      game.restart();
      game.economy.add(2000);
      game.buildTower(0, 'bifang');
      game.buildTower(1, 'fuzhu');
      game.buildTower(6, 'yinglong');
      game.wave.waveNumber = 7;
    }

    const twoFrames = () => new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));

    async function enterLevel2(game) {
      if (game.levelId === 2) { game.restart(); return; }
      game.end('victory');
      await twoFrames();
      frame.contentDocument.querySelector('#next-level-button').click();
      while (game.levelId !== 2 || frame.contentDocument.body.classList.contains('art-loading')) {
        await new Promise(resolve => setTimeout(resolve, 25));
      }
      await twoFrames();
    }

    async function configureLevel2MixedWave(game) {
      await enterLevel2(game);
      game.economy.add(2000);
      game.buildTower(0, 'bifang');
      game.buildTower(3, 'fuzhu');
      game.buildTower(6, 'yinglong');
      game.wave.waveNumber = 7;
    }

    async function configureLevel2Boss(game) {
      await enterLevel2(game);
      game.wave.waveNumber = 9;
      game.startWaveNow();
      const queuedBoss = game.wave.queue.indexOf('paoxiao');
      if (queuedBoss >= 0) game.wave.queue.splice(queuedBoss, 1);
      game.spawnEnemy('paoxiao');
    }

    document.addEventListener('click', async event => {
      const heightButton = event.target.closest('[data-height]');
      if (heightButton) {
        await ready();
        frame.style.height = `${heightButton.dataset.height}px`;
        requestAnimationFrame(() => requestAnimationFrame(() => snapshot(`高度 ${heightButton.dataset.height}px`)));
        return;
      }
      const widthButton = event.target.closest('[data-width]');
      if (widthButton) {
        await ready();
        frame.style.width = `${widthButton.dataset.width}px`;
        requestAnimationFrame(() => requestAnimationFrame(() => snapshot(`${widthButton.dataset.width}px`)));
        return;
      }
      const button = event.target.closest('[data-state]');
      if (!button) return;
      await ready();
      const game = frame.contentWindow.__SHANHAIJING_TD__;
      const state = button.dataset.state;
      if (state === 'reset') game.restart();
      if (state === 'empty') { game.restart(); game.selectedSlot = 0; }
      if (state === 'tower') { game.restart(); game.buildTower(0, 'bifang'); game.selectedSlot = 0; }
      if (state === 'upgrade') { game.restart(); game.economy.add(500); game.buildTower(0, 'bifang'); game.upgradeTower(0); game.sellTower(0); game.selectedSlot = 0; }
      if (state === 'wave1') { game.restart(); game.buildTower(0, 'bifang'); game.buildTower(4, 'fuzhu'); game.startWaveNow(); }
      if (state === 'wave8preview') configureMixedWave(game);
      if (state === 'wave8') {
        configureMixedWave(game);
        game.startWaveNow();
        [['minion', 100], ['swift', 200], ['giant', 280], ['minion', 300]].forEach(([type, distance]) => {
          game.spawnEnemy(type);
          game.enemies.at(-1).pathDistance = distance;
        });
      }
      if (state === 'wave10') {
        game.restart();
        game.wave.waveNumber = 9;
        game.startWaveNow();
        const queuedBoss = game.wave.queue.indexOf('qiongqi');
        if (queuedBoss >= 0) game.wave.queue.splice(queuedBoss, 1);
        game.spawnEnemy('qiongqi');
      }
      if (state === 'frenzy') {
        const boss = game.enemies.find(enemy => enemy.isBoss);
        if (boss) { boss.hp = boss.maxHp * 0.5; game.update(0); }
      }
      if (state === 'nextbanner') game.advanceBanner(game.bannerTimer + 0.01);
      if (state === 'victory') {
        const boss = game.enemies.find(enemy => enemy.isBoss);
        if (boss) { boss.takeDamage(boss.maxHp); game.update(0); }
      }
      if (state === 'blessing') {
        game.restart();
        game.currentChoices = game.blessings.drawChoices([]);
        game.state = 'blessing';
      }
      if (state === 'defeat') { game.restart(); game.damageBase(game.baseHp); }
      if (state === 'level2') await enterLevel2(game);
      if (state === 'level2wave8') {
        await configureLevel2MixedWave(game);
        game.startWaveNow();
        [['chiyu', 120], ['swift', 210], ['yanjia', 290]].forEach(([type, distance]) => {
          game.spawnEnemy(type);
          game.enemies.at(-1).pathDistance = distance;
        });
      }
      if (state === 'level2wave10') await configureLevel2Boss(game);
      if (state === 'consume70') {
        let boss = game.enemies.find(enemy => enemy.type === 'paoxiao');
        if (!boss) { await configureLevel2Boss(game); boss = game.enemies.find(enemy => enemy.type === 'paoxiao'); }
        boss.hp = boss.maxHp * 0.7;
        game.update(0);
      }
      if (state === 'consume40') {
        let boss = game.enemies.find(enemy => enemy.type === 'paoxiao');
        if (!boss) { await configureLevel2Boss(game); boss = game.enemies.find(enemy => enemy.type === 'paoxiao'); }
        boss.hp = boss.maxHp * 0.4;
        game.update(0);
      }
      if (state === 'level2victory') {
        let boss = game.enemies.find(enemy => enemy.type === 'paoxiao');
        if (!boss) { await configureLevel2Boss(game); boss = game.enemies.find(enemy => enemy.type === 'paoxiao'); }
        boss.takeDamage(boss.maxHp);
        game.update(0);
      }
      requestAnimationFrame(() => requestAnimationFrame(() => snapshot(button.textContent)));
    });

    await ready();
    snapshot('初始');
  </script>
</body>
</html>
