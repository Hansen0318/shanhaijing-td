<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#101a16">
  <meta name="description" content="Shanhaijing TD 山海經 Roguelike Tower Defense Graybox Prototype">
  <title>Shanhaijing TD — V0.02</title>
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./styles-fixes.css?v=boss-viewport-1">
</head>
<body class="art-loading">
  <div id="art-loading-overlay" class="art-loading-overlay" role="status" aria-live="polite" aria-label="山海異獸載入中">
    <p>山海異獸載入中<span class="loading-dots" aria-hidden="true"><i></i><i></i><i></i></span></p>
  </div>
  <main id="game-shell" class="game-shell" aria-label="Shanhaijing TD 遊戲">
    <header class="hud">
      <div class="resource"><span>❤️ Base</span><strong id="base-hp">20</strong></div>
      <div class="resource"><span>🪙 Gold</span><strong id="gold">300</strong></div>
      <div class="resource"><span>🌊 Wave</span><strong id="wave">0 / 10</strong></div>
      <button id="speed-button" class="hud-button" aria-label="切換遊戲速度">1×</button>
      <button id="pause-button" class="hud-button" aria-label="暫停遊戲">Ⅱ</button>
    </header>

    <div class="boss-slot">
      <div id="wave-preview" class="wave-preview" aria-live="polite">
        <strong id="wave-preview-title">第1關・崑崙山門</strong>
        <div id="wave-preview-enemies" class="wave-preview-enemies"><span>👺小妖 ×8</span></div>
        <button id="start-wave-button" class="start-wave-inline">開始 W1</button>
      </div>
      <div id="boss-hud" class="boss-hud" hidden aria-live="polite"><strong id="boss-name">窮奇</strong><div class="boss-track"><span id="boss-hp-fill"></span></div><small id="boss-hp-text">2500 / 2500</small></div>
    </div>

    <section class="battlefield" aria-label="塔防戰場">
      <canvas id="game-canvas" width="390" height="610" aria-label="S 型道路與八個塔位"></canvas>
      <div id="banner" class="banner" hidden></div>
    </section>

    <section id="context-panel" class="context-panel" aria-live="polite">
      <p class="panel-hint">點擊圓形塔位，部署山海異獸</p>
    </section>
  </main>

  <section id="blessing-overlay" class="overlay" hidden aria-modal="true" role="dialog">
    <div class="modal blessing-modal"><p class="eyebrow">波次完成</p><h1>選擇山海祝福</h1><div id="blessing-choices" class="blessing-choices"></div></div>
  </section>
  <section id="pause-overlay" class="overlay" hidden aria-modal="true" role="dialog">
    <div class="modal compact"><p class="eyebrow">遊戲暫停</p><h1>暫停</h1><button data-action="continue">繼續</button><button class="secondary" data-action="restart">重新開始</button></div>
  </section>
  <section id="result-overlay" class="overlay" hidden aria-modal="true" role="dialog">
    <div id="result-panel" class="modal compact result-panel"><p class="eyebrow">本次防守結果</p><h1 id="result-title">防守成功</h1><ul id="result-stats"></ul><button id="next-level-button" data-action="next-level" hidden>前往第2關</button><button id="retry-button" data-action="restart">再次挑戰</button></div>
  </section>
  <script type="module" src="./src/main.js?v=boss-viewport-1"></script>
</body>
</html>
